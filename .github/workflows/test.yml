name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Go ${{ matrix.go }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The minimum version in go.mod through the newest release. The
        # newest matters most: golang.org/x/tools must be recent enough to
        # read the package data of the Go version users have installed.
        go: ["1.26.x", "stable"]
    env:
      # Use exactly the Go version from the matrix, not one go.mod asks for.
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}

      - name: Check formatting
        run: |
          # testdata may hold deliberately unformatted inputs
          unformatted=$(gofmt -l $(git ls-files '*.go' | grep -v '/testdata/'))
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Check go.mod and go.sum are tidy
        run: |
          if ! diff=$(go mod tidy -diff); then
            echo "$diff"
            # Also show the needed change as an annotation on the PR.
            # Workflow commands must escape %, CR and LF.
            encoded=$(printf '%s' "$diff" | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | awk 'BEGIN { ORS = "%0A" } 1')
            echo "::error title=go.mod or go.sum is not tidy::Run 'go mod tidy' and commit the result. Needed change:%0A${encoded}"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: |
          set -o pipefail
          if ! go test -race ./... 2>&1 | tee test.log; then
            # Report the failures as an annotation on the PR.
            failures=$(grep -E -A 25 -e '^--- FAIL' -e '^panic:' -e '^FAIL' test.log | head -150)
            encoded=$(printf '%s' "$failures" | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | awk 'BEGIN { ORS = "%0A" } 1')
            echo "::error title=Tests failed on Go ${{ matrix.go }}::${encoded}"
            exit 1
          fi
