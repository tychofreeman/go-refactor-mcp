name: Test

# Changes to documentation alone do not run the tests: Markdown files and
# docs/, except under testdata, where Markdown can be a test's input.
on:
  pull_request:
    paths:
      - "**"
      - "!**.md"
      - "!docs/**"
      - "**/testdata/**"
  push:
    branches: [main]
    paths:
      - "**"
      - "!**.md"
      - "!docs/**"
      - "**/testdata/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Go ${{ matrix.go }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The minimum version in go.mod and the newest release. Each costs
        # about 5-8 of the account's 5,000 Actions minutes a month; the
        # minimum was left out from 2026-10-27 to 2026-10-30 to save them.
        # The newest matters most: golang.org/x/tools must be recent
        # enough to read the package data of the Go version users have
        # installed.
        go: ["1.26.x", "stable"]
    env:
      # Use exactly the Go version from the matrix, not one go.mod asks for.
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          # The cache is saved once per key, by the first job to finish.
          # This file is in the key so that only this job's full build
          # cache (the TypeScript compiler compiled) is saved under it;
          # change it to start a new one.
          cache-dependency-path: |
            go.sum
            .github/workflows/test.yml

      - name: Check formatting
        run: |
          # testdata may hold deliberately unformatted inputs
          unformatted=$(gofmt -l $(git ls-files '*.go' | grep -v '/testdata/'))
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Check go.mod and go.sum are tidy
        run: |
          if ! diff=$(go mod tidy -diff); then
            echo "$diff"
            # Also show the needed change as an annotation on the PR.
            # Workflow commands must escape %, CR and LF.
            encoded=$(printf '%s' "$diff" | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | awk 'BEGIN { ORS = "%0A" } 1')
            echo "::error title=go.mod or go.sum is not tidy::Run 'go mod tidy' and commit the result. Needed change:%0A${encoded}"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: |
          # -json records how long each package and test took; test.log
          # keeps the usual output, for the log and the failure annotation.
          status=0
          # The TypeScript packages run without -race: each of their test
          # binaries links the whole TypeScript compiler, which the race
          # detector makes far slower to build, and they run little
          # concurrently.
          go test -race -json $(go list ./... | grep -v '/internal/ts/') > test.json 2> test.err || status=$?
          go test -json ./internal/ts/... >> test.json 2>> test.err || status=$?
          { cat test.err; jq -Rj 'fromjson? | select(.Action == "output" or .Action == "build-output") | .Output' test.json; } > test.log
          cat test.log
          sh .github/test-times.sh test.json "Go ${{ matrix.go }}"
          if [ "$status" -ne 0 ]; then
            # Report the failures as an annotation on the PR.
            failures=$(grep -E -A 25 -e '^--- FAIL' -e '^panic:' -e '^FAIL' test.log | head -150)
            encoded=$(printf '%s' "$failures" | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | awk 'BEGIN { ORS = "%0A" } 1')
            echo "::error title=Tests failed on Go ${{ matrix.go }}::${encoded}"
            exit 1
          fi

  vulncheck:
    name: Vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          # Not cached: finishing first, this job saved a cache of the
          # modules alone under the test job's key.
          cache: false

      - name: govulncheck
        # Fails only when the code calls a function with a known
        # vulnerability, in a dependency or the standard library.
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
